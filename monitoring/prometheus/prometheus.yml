global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: learning-agent-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: learning-agent-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101
        refresh_interval: 15s
